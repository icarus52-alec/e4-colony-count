<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#315c4b" />
  <title>E4 Colony Count</title>
  <link rel="icon" type="image/png" href="app-icon.png" />
  <link rel="apple-touch-icon" href="app-icon.png" />
  <link rel="manifest" href="manifest.json" />
  <style>
    :root {
      color-scheme: light;
      --ink: #15120b;
      --muted: #66562c;
      --paper: #fff4c9;
      --card: #fffdf7;
      --line: #2b2412;
      --green: #f1a900;
      --green-2: #17130a;
      --mint: #fff0ad;
      --amber: #17130a;
      --danger: #a23b32;
      --shadow: 0 16px 42px rgba(38, 57, 49, .10);
      --bg-a: #fffaf0;
      --bg-b: #ffd65a;
      --dot: rgba(20, 17, 9, 0.13);
      --panel: rgba(255, 253, 247, .94);
      --focus-ring: rgba(241, 169, 0, .22);
      --secondary-hover: #f4dfa0;
      --photo-bg: #fff8df;
      --photo-line: #a98b30;
      --complete-border: rgba(23, 19, 10, .48);
      --divider: rgba(23, 19, 10, .22);
      --danger-soft: #f5e2df;
    }

    :root[data-theme="red"] {
      --ink:#1a1112; --muted:#704548; --paper:#fff5f5; --line:#d99b9f;
      --green:#e60012; --green-2:#9f000c; --mint:#ffe1e4; --amber:#1a1112;
      --bg-a:#ffffff; --bg-b:#ffd8dc; --dot:rgba(230,0,18,.16); --focus-ring:rgba(230,0,18,.18);
      --secondary-hover:#f3cdd1; --photo-bg:#fff1f2; --photo-line:#d99b9f; --complete-border:rgba(230,0,18,.46); --divider:rgba(230,0,18,.20);
    }

    :root[data-theme="blue"] {
      --ink:#071727; --muted:#4a6072; --paper:#f4faff; --line:#9dc6e7;
      --green:#0d85e0; --green-2:#075a9b; --mint:#dcefff; --amber:#071727;
      --bg-a:#ffffff; --bg-b:#d5edff; --dot:rgba(13,133,224,.16); --focus-ring:rgba(13,133,224,.18);
      --secondary-hover:#c9e5fa; --photo-bg:#eff8ff; --photo-line:#8bbce0; --complete-border:rgba(13,133,224,.46); --divider:rgba(13,133,224,.20);
    }

    :root[data-theme="pink"] {
      --ink:#2a0d20; --muted:#80566e; --paper:#fff4fa; --line:#e7a7ca;
      --green:#ff3b9d; --green-2:#a90057; --mint:#ffe0f0; --amber:#2a0d20;
      --bg-a:#ffffff; --bg-b:#ffd5ea; --dot:rgba(255,59,157,.16); --focus-ring:rgba(255,59,157,.18);
      --secondary-hover:#f5cde1; --photo-bg:#fff1f8; --photo-line:#df9bc0; --complete-border:rgba(255,59,157,.46); --divider:rgba(255,59,157,.20);
    }

    :root[data-theme="violet"] {
      --ink:#1d1030; --muted:#6e5a81; --paper:#faf6ff; --line:#c9a9e8;
      --green:#7a2cff; --green-2:#4d0fae; --mint:#ebddff; --amber:#1d1030;
      --bg-a:#ffffff; --bg-b:#e8d9ff; --dot:rgba(122,44,255,.15); --focus-ring:rgba(122,44,255,.18);
      --secondary-hover:#dfcdf5; --photo-bg:#f8f1ff; --photo-line:#b995dd; --complete-border:rgba(122,44,255,.46); --divider:rgba(122,44,255,.20);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle, var(--dot) 0 4px, transparent 4.5px) 0 0 / 42px 42px,
        linear-gradient(145deg, var(--bg-a), var(--bg-b));
    }

    button, input, textarea { font: inherit; }
    button { cursor: pointer; }

    .shell { width: min(1100px, 100%); margin: 0 auto; padding: 24px 18px 80px; }

    header {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      align-items: end;
      margin-bottom: 22px;
    }

    .kicker {
      margin: 0 0 7px;
      color: var(--green-2);
      font-size: .75rem;
      font-weight: 850;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h1 { margin: 0; font-family: Georgia, "Noto Serif TC", serif; font-size: clamp(2.1rem, 7vw, 4.7rem); line-height: .96; letter-spacing: -.045em; }
    header p:last-child { margin: 12px 0 0; color: var(--muted); line-height: 1.55; }

    .save-status {
      flex: 0 0 auto;
      padding: 8px 12px;
      border-radius: 999px;
      color: var(--green);
      background: var(--mint);
      font-size: .78rem;
      font-weight: 800;
    }

    .panel, .plate-card {
      border: 1px solid var(--divider);
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .panel { padding: 20px; border-radius: 20px; margin-bottom: 22px; }
    .panel h2 { margin: 0 0 15px; font-size: 1rem; }

    .setup-grid { display: grid; grid-template-columns: 1fr 1.25fr .65fr .75fr; gap: 14px; align-items: end; }
    label { display: grid; gap: 7px; font-size: .82rem; font-weight: 800; }
    .hint { color: var(--muted); font-size: .75rem; font-weight: 500; line-height: 1.45; }

    input, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 11px;
      color: var(--ink);
      background: white;
      outline: none;
    }

    input { min-height: 45px; padding: 0 12px; }
    textarea { min-height: 76px; padding: 11px 12px; resize: vertical; }
    input:focus, textarea:focus { border-color: var(--green-2); box-shadow: 0 0 0 3px var(--focus-ring); }

    .button-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 15px; }
    .btn {
      min-height: 43px;
      border: 0;
      border-radius: 11px;
      padding: 0 16px;
      color: white;
      background: var(--green);
      font-weight: 800;
    }
    .btn:hover { background: var(--green-2); }
    .btn.secondary { color: var(--green); background: var(--mint); }
    .btn.secondary:hover { background: var(--secondary-hover); }
    .btn.danger { color: var(--danger); background: var(--danger-soft); }

    .toolbar { display: flex; justify-content: space-between; gap: 14px; align-items: center; margin: 28px 0 14px; }
    .toolbar h2 { margin: 0; font-size: 1rem; }
    .progress { color: var(--muted); font-size: .8rem; font-weight: 750; }

    .salinity-group { margin-bottom: 26px; }
    .salinity-title { display: flex; align-items: center; gap: 10px; margin: 0 0 11px; font-size: 1.12rem; }
    .salinity-title::after { content: ""; height: 1px; flex: 1; background: var(--divider); }
    .salinity-badge { padding: 5px 10px; border-radius: 999px; color: white; background: var(--green); font-size: .75rem; }

    .plate-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
    .plate-card { border-radius: 17px; padding: 16px; overflow: hidden; }
    .plate-card.complete { border-color: var(--complete-border); }

    .card-top { display: flex; justify-content: space-between; gap: 12px; align-items: start; margin-bottom: 13px; }
    .rep { margin: 0; font-size: 1.05rem; }
    .total { text-align: right; }
    .total span { display: block; color: var(--muted); font-size: .66rem; font-weight: 800; text-transform: uppercase; letter-spacing: .07em; }
    .total strong { font-family: Georgia, serif; font-size: 1.55rem; color: var(--green); }

    .section-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
    .section-grid label { font-size: .72rem; }
    .section-grid input { min-height: 41px; }

    .photo-zone {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 112px;
      margin-top: 13px;
      overflow: hidden;
      border: 1px dashed var(--photo-line);
      border-radius: 12px;
      color: var(--green);
      background: var(--photo-bg);
      text-align: center;
    }

    .photo-zone input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
    .photo-zone img { width: 100%; height: 150px; object-fit: cover; display: none; }
    .photo-zone.has-photo img { display: block; }
    .photo-zone.has-photo .photo-prompt { display: none; }
    .photo-prompt { padding: 14px; font-size: .78rem; font-weight: 800; line-height: 1.5; }
    .photo-prompt b { display: block; font-size: 1.35rem; }

    .photo-actions { display: flex; gap: 8px; margin-top: 8px; }
    .small-btn { flex: 1; min-height: 34px; border: 0; border-radius: 9px; color: var(--green); background: var(--mint); font-size: .72rem; font-weight: 800; }
    .small-btn.remove-photo { color: var(--danger); background: var(--danger-soft); display: none; }
    .plate-card.has-photo .remove-photo { display: block; }

    .note { margin-top: 10px; }
    .note textarea { min-height: 58px; font-size: .8rem; }

    .empty { padding: 46px 20px; border: 1px dashed var(--line); border-radius: 18px; color: var(--muted); text-align: center; }

    .photo-library { margin-top: 30px; }
    .photo-library-head { display: flex; justify-content: space-between; align-items: end; gap: 16px; margin-bottom: 16px; }
    .photo-library-head h2 { margin: 0 0 4px; font-size: 1.15rem; }
    .photo-library-head p { margin: 0; color: var(--muted); font-size: .78rem; }
    .photo-search { max-width: 310px; }
    .photo-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(205px, 1fr)); gap: 14px; }
    .gallery-card { overflow: hidden; border: 1px solid var(--line); border-radius: 14px; background: var(--card); }
    .gallery-image { width: 100%; height: 155px; padding: 0; border: 0; background: var(--photo-bg); display: block; }
    .gallery-image img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .gallery-body { padding: 12px; }
    .gallery-body strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .gallery-meta { margin: 3px 0 10px; color: var(--muted); font-size: .74rem; }
    .gallery-load { width: 100%; }
    .photo-viewer { width: min(920px, calc(100vw - 24px)); max-height: 92vh; padding: 0; border: 0; border-radius: 18px; overflow: hidden; background: #111; }
    .photo-viewer::backdrop { background: rgba(0,0,0,.72); }
    .photo-viewer img { display: block; width: 100%; max-height: 78vh; object-fit: contain; background: #111; }
    .viewer-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; color: white; background: #111; }
    .viewer-bar span { font-size: .82rem; }
    .viewer-close { border: 0; border-radius: 9px; padding: 7px 12px; color: var(--ink); background: white; font-weight: 800; }

    footer { margin-top: 28px; color: var(--muted); font-size: .72rem; line-height: 1.6; }

    .header-actions { display: grid; justify-items: end; gap: 10px; }
    .theme-picker {
      display: flex;
      gap: 8px;
      padding: 9px;
      border: 1px solid var(--divider);
      border-radius: 999px;
      background: rgba(255,255,255,.82);
    }
    .theme-dot {
      width: 27px;
      height: 27px;
      padding: 0;
      border: 3px solid white;
      border-radius: 50%;
      background: var(--swatch);
      box-shadow: 0 0 0 1px rgba(0,0,0,.2), inset 7px 0 0 var(--swatch-2);
    }
    .theme-dot[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--ink), inset 7px 0 0 var(--swatch-2); }
    .theme-dot:focus-visible { outline: 3px solid var(--green); outline-offset: 3px; }

    @media (max-width: 850px) {
      .plate-grid { grid-template-columns: 1fr; }
      .setup-grid { grid-template-columns: 1fr 1fr; }
    }

    @media (max-width: 560px) {
      .shell { padding: 18px 12px 60px; }
      header { display: block; }
      .header-actions { justify-items: start; margin-top: 14px; }
      .save-status { display: inline-block; }
      .setup-grid { grid-template-columns: 1fr; }
      .button-row .btn { flex: 1; }
      .toolbar { align-items: start; }
      .photo-library-head { display: block; }
      .photo-search { max-width: none; margin-top: 12px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div>
        <p class="kicker">Experiment E4</p>
        <h1>Colony Count</h1>
        <p>鹽度 × 三重複培養盤｜分區計數、照片與備註集中記錄</p>
      </div>
      <div class="header-actions">
        <div class="theme-picker" aria-label="選擇配色">
          <button class="theme-dot" type="button" data-theme="pumpkin" style="--swatch:#f1a900;--swatch-2:#111111" aria-label="南瓜黃黑" title="南瓜黃黑"></button>
          <button class="theme-dot" type="button" data-theme="red" style="--swatch:#e60012;--swatch-2:#ffffff" aria-label="紅白圓點" title="紅白圓點"></button>
          <button class="theme-dot" type="button" data-theme="blue" style="--swatch:#0d85e0;--swatch-2:#071727" aria-label="亮藍黑白" title="亮藍黑白"></button>
          <button class="theme-dot" type="button" data-theme="pink" style="--swatch:#ff3b9d;--swatch-2:#ffffff" aria-label="桃紅圓點" title="桃紅圓點"></button>
          <button class="theme-dot" type="button" data-theme="violet" style="--swatch:#7a2cff;--swatch-2:#ffffff" aria-label="紫羅蘭" title="紫羅蘭"></button>
        </div>
        <div class="save-status" id="saveStatus">資料儲存在此裝置</div>
      </div>
    </header>

    <section class="panel" aria-labelledby="setupTitle">
      <h2 id="setupTitle">實驗設定</h2>
      <div class="setup-grid">
        <label>
          樣本名稱
          <input id="sampleName" placeholder="例如：E4-AV1-1" autocomplete="off" />
          <span class="hint">樣本名稱與日期共同區分每次紀錄。</span>
        </label>
        <label>
          鹽度濃度（ppt）
          <input id="salinities" value="0, 1, 2, 4, 8, 16, 32" />
          <span class="hint">用逗號分隔；每個濃度會建立 R1、R2、R3。</span>
        </label>
        <label>
          每盤分區數
          <input id="sectionCount" type="number" min="1" max="12" step="1" value="4" />
          <span class="hint">預設 4 區，總數為各區加總。</span>
        </label>
        <label>
          計數日期
          <input id="countDate" type="date" />
          <span class="hint">套用到這次紀錄。</span>
        </label>
      </div>
      <div class="button-row">
        <button class="btn" id="applySetup" type="button">建立／更新記錄表</button>
        <button class="btn secondary" id="exportCsv" type="button">匯出 CSV</button>
        <button class="btn secondary" id="backupJson" type="button">下載完整備份 JSON</button>
        <button class="btn secondary" id="restoreJson" type="button">匯入完整備份</button>
        <button class="btn secondary" id="readableBackup" type="button">下載可閱讀備份 ZIP</button>
        <button class="btn danger" id="clearAll" type="button">清除全部</button>
        <input id="restoreFile" type="file" accept="application/json,.json" hidden />
      </div>
    </section>

    <div class="toolbar">
      <h2>培養盤紀錄</h2>
      <div class="progress" id="progress">0 / 0 完成計數</div>
    </div>

    <main id="records"></main>

    <section class="panel photo-library" aria-labelledby="photoLibraryTitle">
      <div class="photo-library-head">
        <div>
          <h2 id="photoLibraryTitle">照片紀錄庫</h2>
          <p>依樣本名稱、日期、鹽度或重複編號搜尋；點照片可放大。</p>
        </div>
        <input class="photo-search" id="photoSearch" type="search" placeholder="搜尋照片紀錄…" aria-label="搜尋照片紀錄" />
      </div>
      <div class="photo-gallery" id="photoGallery"></div>
    </section>

    <footer>
      不同樣本與日期會分開保存。照片與數據只保存在目前瀏覽器／裝置；清除瀏覽器網站資料會移除紀錄。「完整備份 JSON」用於還原 App；「可閱讀備份 ZIP」可在電腦直接查看 CSV 與 JPG。
    </footer>
  </div>

  <dialog class="photo-viewer" id="photoViewer">
    <img id="viewerImage" alt="培養盤照片放大檢視" />
    <div class="viewer-bar"><span id="viewerCaption"></span><button class="viewer-close" id="viewerClose" type="button">關閉</button></div>
  </dialog>

  <script>
    const STORAGE_KEY = 'e4-colony-count-v1';
    const DB_NAME = 'e4-colony-count-photos';
    const DB_STORE = 'photos';

    const state = loadState();
    const recordsEl = document.querySelector('#records');
    const sampleNameEl = document.querySelector('#sampleName');
    const salinitiesEl = document.querySelector('#salinities');
    const sectionCountEl = document.querySelector('#sectionCount');
    const countDateEl = document.querySelector('#countDate');
    const statusEl = document.querySelector('#saveStatus');
    const progressEl = document.querySelector('#progress');
    const photoSearchEl = document.querySelector('#photoSearch');
    const photoGalleryEl = document.querySelector('#photoGallery');
    const photoViewerEl = document.querySelector('#photoViewer');
    const viewerImageEl = document.querySelector('#viewerImage');
    const viewerCaptionEl = document.querySelector('#viewerCaption');
    const themeKey = 'e4-colony-theme-v1';
    let galleryUrls = [];
    let galleryRenderToken = 0;

    function applyTheme(theme) {
      const selected = ['pumpkin', 'red', 'blue', 'pink', 'violet'].includes(theme) ? theme : 'pumpkin';
      document.documentElement.dataset.theme = selected;
      localStorage.setItem(themeKey, selected);
      document.querySelectorAll('.theme-dot').forEach(button => {
        button.setAttribute('aria-pressed', String(button.dataset.theme === selected));
      });
      document.querySelector('meta[name="theme-color"]').content = getComputedStyle(document.documentElement).getPropertyValue('--green').trim();
    }

    document.querySelectorAll('.theme-dot').forEach(button => {
      button.addEventListener('click', () => applyTheme(button.dataset.theme));
    });

    function todayLocal() {
      const d = new Date();
      d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
      return d.toISOString().slice(0, 10);
    }

    function defaultState() {
      return { sampleName: '', salinities: [0, 1, 2, 4, 8, 16, 32], sectionCount: 4, countDate: todayLocal(), records: {}, sessions: {} };
    }

    function loadState() {
      try {
        const loaded = { ...defaultState(), ...JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}') };
        loaded.sessions = loaded.sessions || {};
        loaded.records = loaded.records || {};
        return loaded;
      } catch {
        return defaultState();
      }
    }

    function saveState() {
      saveCurrentSession();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      statusEl.textContent = '已儲存 ' + new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });
    }

    function sessionKey(sampleName = state.sampleName, countDate = state.countDate) {
      return `${String(sampleName || '未命名樣本').trim() || '未命名樣本'}||${countDate}`;
    }

    function saveCurrentSession() {
      state.sessions ||= {};
      state.sessions[sessionKey()] = {
        sampleName: state.sampleName || '',
        countDate: state.countDate,
        salinities: [...state.salinities],
        sectionCount: state.sectionCount,
        records: state.records
      };
    }

    function clone(value) { return JSON.parse(JSON.stringify(value)); }

    function loadSession(key) {
      const session = state.sessions?.[key];
      if (!session) return;
      saveCurrentSession();
      state.sampleName = session.sampleName || '';
      state.countDate = session.countDate || todayLocal();
      state.salinities = [...session.salinities];
      state.sectionCount = session.sectionCount;
      state.records = clone(session.records || {});
      ensureRecords();
      saveState();
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function recordId(salinity, rep) { return `s${salinity}-r${rep}`.replace('.', '_'); }

    function ensureRecords() {
      state.salinities.forEach(salinity => {
        [1, 2, 3].forEach(rep => {
          const id = recordId(salinity, rep);
          const previous = state.records[id] || {};
          const counts = Array.from({ length: state.sectionCount }, (_, i) => previous.counts?.[i] ?? '');
          state.records[id] = { salinity, rep, counts, note: previous.note || '', hasPhoto: Boolean(previous.hasPhoto), photoId: previous.photoId || (previous.hasPhoto ? id : '') };
        });
      });
    }

    function parseSalinities(value) {
      return [...new Set(value.split(',').map(x => Number(x.trim())).filter(x => Number.isFinite(x) && x >= 0))];
    }

    function totalFor(record) {
      return record.counts.reduce((sum, value) => sum + (value === '' ? 0 : Number(value)), 0);
    }

    function isComplete(record) {
      return record.counts.length === state.sectionCount && record.counts.every(value => value !== '' && Number(value) >= 0);
    }

    async function openPhotoDb() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, 1);
        request.onupgradeneeded = () => request.result.createObjectStore(DB_STORE);
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    async function savePhoto(id, blob) {
      const db = await openPhotoDb();
      await new Promise((resolve, reject) => {
        const tx = db.transaction(DB_STORE, 'readwrite');
        tx.objectStore(DB_STORE).put(blob, id);
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
      });
      db.close();
    }

    async function getPhoto(id) {
      const db = await openPhotoDb();
      const blob = await new Promise((resolve, reject) => {
        const request = db.transaction(DB_STORE).objectStore(DB_STORE).get(id);
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
      db.close();
      return blob;
    }

    async function deletePhoto(id) {
      const db = await openPhotoDb();
      await new Promise((resolve, reject) => {
        const tx = db.transaction(DB_STORE, 'readwrite');
        tx.objectStore(DB_STORE).delete(id);
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
      });
      db.close();
    }

    async function replaceAllPhotos(photoMap) {
      const db = await openPhotoDb();
      await new Promise((resolve, reject) => {
        const tx = db.transaction(DB_STORE, 'readwrite');
        const store = tx.objectStore(DB_STORE);
        store.clear();
        photoMap.forEach(({ id, blob }) => store.put(blob, id));
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
        tx.onabort = () => reject(tx.error);
      });
      db.close();
    }

    function compressImage(file) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
          const max = 1600;
          const scale = Math.min(1, max / Math.max(img.width, img.height));
          const canvas = document.createElement('canvas');
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          canvas.toBlob(blob => {
            URL.revokeObjectURL(url);
            blob ? resolve(blob) : reject(new Error('無法處理照片'));
          }, 'image/jpeg', .82);
        };
        img.onerror = reject;
        img.src = url;
      });
    }

    function render() {
      sampleNameEl.value = state.sampleName || '';
      salinitiesEl.value = state.salinities.join(', ');
      sectionCountEl.value = state.sectionCount;
      countDateEl.value = state.countDate;
      recordsEl.innerHTML = '';

      if (!state.salinities.length) {
        recordsEl.innerHTML = '<div class="empty">請先輸入至少一個鹽度濃度。</div>';
        progressEl.textContent = '0 / 0 完成計數';
        return;
      }

      let completed = 0;
      state.salinities.forEach(salinity => {
        const group = document.createElement('section');
        group.className = 'salinity-group';
        group.innerHTML = `<h3 class="salinity-title"><span class="salinity-badge">${salinity} ppt</span></h3><div class="plate-grid"></div>`;
        const grid = group.querySelector('.plate-grid');

        [1, 2, 3].forEach(rep => {
          const id = recordId(salinity, rep);
          const record = state.records[id];
          if (isComplete(record)) completed++;
          const card = document.createElement('article');
          card.className = `plate-card${isComplete(record) ? ' complete' : ''}${record.hasPhoto ? ' has-photo' : ''}`;
          card.dataset.id = id;

          const sectionInputs = record.counts.map((value, index) => `
            <label>區域 ${index + 1}
              <input class="count-input" data-index="${index}" type="number" min="0" step="1" inputmode="numeric" value="${value}" placeholder="0" />
            </label>`).join('');

          card.innerHTML = `
            <div class="card-top">
              <h4 class="rep">R${rep}</h4>
              <div class="total"><span>Total colonies</span><strong>${totalFor(record)}</strong></div>
            </div>
            <div class="section-grid">${sectionInputs}</div>
            <div class="photo-zone${record.hasPhoto ? ' has-photo' : ''}">
              <img alt="${salinity} ppt R${rep} 培養盤照片" />
              <div class="photo-prompt"><b>＋</b>拍照或選擇培養盤照片</div>
              <input class="photo-input" type="file" accept="image/*" capture="environment" aria-label="拍攝 ${salinity} ppt R${rep} 培養盤" />
            </div>
            <div class="photo-actions">
              <button type="button" class="small-btn choose-photo">拍照／更換</button>
              <button type="button" class="small-btn remove-photo">移除照片</button>
            </div>
            <label class="note">備註<textarea placeholder="污染、菌落重疊、特殊觀察…">${escapeHtml(record.note)}</textarea></label>`;

          bindCard(card, record, id);
          grid.appendChild(card);
          if (record.hasPhoto) loadPhotoPreview(card, record.photoId || id);
        });

        recordsEl.appendChild(group);
      });

      progressEl.textContent = `${completed} / ${state.salinities.length * 3} 完成計數`;
      renderPhotoLibrary();
    }

    function escapeHtml(text) {
      return String(text).replace(/[&<>'"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[c]));
    }

    function bindCard(card, record, id) {
      card.querySelectorAll('.count-input').forEach(input => {
        input.addEventListener('input', () => {
          const value = input.value;
          record.counts[Number(input.dataset.index)] = value === '' ? '' : Math.max(0, Math.round(Number(value)));
          card.querySelector('.total strong').textContent = totalFor(record);
          card.classList.toggle('complete', isComplete(record));
          saveState();
          updateProgress();
        });
      });

      const fileInput = card.querySelector('.photo-input');
      card.querySelector('.choose-photo').addEventListener('click', () => fileInput.click());
      fileInput.addEventListener('change', async () => {
        const file = fileInput.files?.[0];
        if (!file) return;
        statusEl.textContent = '正在處理照片…';
        try {
          const blob = await compressImage(file);
          const photoId = record.photoId || `${sessionKey()}::${id}`;
          await savePhoto(photoId, blob);
          record.hasPhoto = true;
          record.photoId = photoId;
          saveState();
          card.classList.add('has-photo');
          card.querySelector('.photo-zone').classList.add('has-photo');
          setPreview(card, blob);
          renderPhotoLibrary();
        } catch {
          statusEl.textContent = '照片儲存失敗，請再試一次';
        }
      });

      card.querySelector('.remove-photo').addEventListener('click', async () => {
        if (!confirm('移除這張培養盤照片？')) return;
        await deletePhoto(record.photoId || id);
        record.hasPhoto = false;
        record.photoId = '';
        saveState();
        card.classList.remove('has-photo');
        card.querySelector('.photo-zone').classList.remove('has-photo');
        const img = card.querySelector('img');
        if (img.dataset.url) URL.revokeObjectURL(img.dataset.url);
        img.removeAttribute('src');
        renderPhotoLibrary();
      });

      card.querySelector('textarea').addEventListener('input', event => {
        record.note = event.target.value;
        saveState();
      });
    }

    async function loadPhotoPreview(card, photoId) {
      const blob = await getPhoto(photoId);
      if (blob) setPreview(card, blob);
    }

    function photoEntries() {
      saveCurrentSession();
      const entries = [];
      Object.entries(state.sessions || {}).forEach(([key, session]) => {
        Object.entries(session.records || {}).forEach(([id, record]) => {
          if (!record.hasPhoto) return;
          entries.push({
            key,
            id,
            photoId: record.photoId || id,
            sampleName: session.sampleName || '未命名樣本',
            countDate: session.countDate || '',
            salinity: record.salinity,
            rep: record.rep,
            note: record.note || ''
          });
        });
      });
      return entries.sort((a, b) => `${b.countDate}${b.sampleName}`.localeCompare(`${a.countDate}${a.sampleName}`));
    }

    async function renderPhotoLibrary() {
      const token = ++galleryRenderToken;
      galleryUrls.forEach(URL.revokeObjectURL);
      galleryUrls = [];
      const query = photoSearchEl.value.trim().toLowerCase();
      const entries = photoEntries().filter(entry => !query || `${entry.sampleName} ${entry.countDate} ${entry.salinity} ppt r${entry.rep} ${entry.note}`.toLowerCase().includes(query));
      photoGalleryEl.innerHTML = entries.length ? '' : `<div class="empty">${query ? '找不到符合的照片紀錄。' : '尚未儲存培養盤照片。'}</div>`;
      if (!entries.length) return;
      const photos = await Promise.all(entries.map(async entry => ({ entry, blob: await getPhoto(entry.photoId) })));
      if (token !== galleryRenderToken) return;
      photos.forEach(({ entry, blob }) => {
        if (!blob) return;
        const url = URL.createObjectURL(blob);
        galleryUrls.push(url);
        const card = document.createElement('article');
        card.className = 'gallery-card';
        card.innerHTML = `<button class="gallery-image" type="button" aria-label="放大 ${escapeHtml(entry.sampleName)} ${entry.salinity} ppt R${entry.rep}"><img src="${url}" alt="${escapeHtml(entry.sampleName)} ${entry.salinity} ppt R${entry.rep} 培養盤照片" /></button><div class="gallery-body"><strong>${escapeHtml(entry.sampleName)}</strong><div class="gallery-meta">${entry.countDate} · ${entry.salinity} ppt · R${entry.rep}</div><button class="small-btn gallery-load" type="button">載入此紀錄</button></div>`;
        card.querySelector('.gallery-image').addEventListener('click', () => openPhotoViewer(url, `${entry.sampleName} · ${entry.countDate} · ${entry.salinity} ppt · R${entry.rep}`));
        card.querySelector('.gallery-load').addEventListener('click', () => loadSession(entry.key));
        photoGalleryEl.appendChild(card);
      });
      if (!photoGalleryEl.children.length) photoGalleryEl.innerHTML = '<div class="empty">照片檔案不存在，請從完整備份還原。</div>';
    }

    function openPhotoViewer(url, caption) {
      viewerImageEl.src = url;
      viewerCaptionEl.textContent = caption;
      photoViewerEl.showModal();
    }

    function setPreview(card, blob) {
      const img = card.querySelector('img');
      if (img.dataset.url) URL.revokeObjectURL(img.dataset.url);
      const url = URL.createObjectURL(blob);
      img.src = url;
      img.dataset.url = url;
    }

    function updateProgress() {
      const current = state.salinities.flatMap(s => [1, 2, 3].map(r => state.records[recordId(s, r)]));
      progressEl.textContent = `${current.filter(isComplete).length} / ${current.length} 完成計數`;
    }

    document.querySelector('#applySetup').addEventListener('click', () => {
      const sampleName = sampleNameEl.value.trim();
      const salinities = parseSalinities(salinitiesEl.value);
      const sections = Math.min(12, Math.max(1, Math.round(Number(sectionCountEl.value) || 4)));
      const countDate = countDateEl.value || todayLocal();
      if (!sampleName) return alert('請輸入樣本名稱。');
      if (!salinities.length) return alert('請至少輸入一個有效鹽度。');
      const oldKey = sessionKey();
      saveCurrentSession();
      const nextKey = sessionKey(sampleName, countDate);
      const isNamingExistingRecord = !state.sampleName && countDate === state.countDate && nextKey !== oldKey;
      if (isNamingExistingRecord) {
        state.sampleName = sampleName;
        state.salinities = salinities;
        state.sectionCount = sections;
        delete state.sessions[oldKey];
      } else if (nextKey !== oldKey && state.sessions[nextKey]) {
        const session = state.sessions[nextKey];
        state.sampleName = session.sampleName;
        state.countDate = session.countDate;
        state.salinities = [...session.salinities];
        state.sectionCount = session.sectionCount;
        state.records = clone(session.records || {});
      } else {
        state.sampleName = sampleName;
        state.countDate = countDate;
        state.salinities = salinities;
        state.sectionCount = sections;
        if (nextKey !== oldKey) state.records = {};
      }
      ensureRecords();
      saveState();
      render();
    });

    document.querySelector('#exportCsv').addEventListener('click', () => {
      const rows = [['sample_name', 'date', 'salinity_ppt', 'replicate', ...Array.from({ length: state.sectionCount }, (_, i) => `section_${i + 1}`), 'total_colonies', 'has_photo', 'note']];
      state.salinities.forEach(s => [1, 2, 3].forEach(r => {
        const record = state.records[recordId(s, r)];
        rows.push([state.sampleName, state.countDate, s, `R${r}`, ...record.counts, totalFor(record), record.hasPhoto ? 'yes' : 'no', record.note]);
      }));
      const safeSample = (state.sampleName || 'sample').replace(/[\\/:*?"<>|]+/g, '_');
      downloadBlob(new Blob(['\ufeff' + rows.map(row => row.map(csvCell).join(',')).join('\r\n')], { type: 'text/csv;charset=utf-8' }), `E4_colony_count_${safeSample}_${state.countDate}.csv`);
    });

    function csvCell(value) { return `"${String(value ?? '').replaceAll('"', '""')}"`; }

    document.querySelector('#backupJson').addEventListener('click', async () => {
      statusEl.textContent = '正在準備完整備份…';
      saveCurrentSession();
      const photos = {};
      const photoIds = [...new Set(photoEntries().map(entry => entry.photoId))];
      for (const photoId of photoIds) {
        const blob = await getPhoto(photoId);
        if (blob) photos[photoId] = await blobToDataUrl(blob);
      }
      downloadBlob(new Blob([JSON.stringify({ version: 2, exportedAt: new Date().toISOString(), state, photos }, null, 2)], { type: 'application/json' }), `E4_colony_count_backup_${state.countDate}.json`);
      statusEl.textContent = '完整備份已下載';
    });

    document.querySelector('#restoreJson').addEventListener('click', () => document.querySelector('#restoreFile').click());

    document.querySelector('#restoreFile').addEventListener('change', async event => {
      const file = event.target.files?.[0];
      if (!file) return;
      try {
        const backup = JSON.parse(await file.text());
        if (!backup.state || typeof backup.state !== 'object' || !backup.photos || typeof backup.photos !== 'object') throw new Error('invalid backup');
        const photoMap = Object.entries(backup.photos).map(([id, dataUrl]) => ({ id, blob: dataUrlToBlob(dataUrl) }));
        if (!confirm(`匯入會取代目前所有 E4 計數與照片。\n備份內含 ${photoMap.length} 張照片。確定繼續？`)) return;
        statusEl.textContent = '正在還原完整備份…';
        await replaceAllPhotos(photoMap);
        const restored = { ...defaultState(), ...backup.state };
        restored.sessions = restored.sessions || {};
        restored.records = restored.records || {};
        Object.keys(state).forEach(key => delete state[key]);
        Object.assign(state, restored);
        ensureRecords();
        saveState();
        render();
        statusEl.textContent = `備份已還原（${photoMap.length} 張照片）`;
      } catch (error) {
        console.error(error);
        alert('無法匯入此備份。請確認檔案是由 E4 App 的「下載完整備份 JSON」產生。');
        statusEl.textContent = '備份匯入失敗';
      } finally {
        event.target.value = '';
      }
    });

    document.querySelector('#readableBackup').addEventListener('click', async () => {
      statusEl.textContent = '正在製作可閱讀備份 ZIP…';
      try {
        saveCurrentSession();
        const files = [];
        const rows = allSessionCsvRows();
        files.push({ name: 'E4_all_colony_counts.csv', data: new TextEncoder().encode('\ufeff' + rows.map(row => row.map(csvCell).join(',')).join('\r\n')) });
        files.push({ name: 'README.txt', data: new TextEncoder().encode('E4 Colony Count readable backup\r\n\r\nE4_all_colony_counts.csv：所有樣本的計數與照片索引。\r\nphotos/：可直接用 Windows 相片開啟的培養盤 JPG。\r\n\r\n照片檔名格式：樣本名稱_日期_鹽度ppt_R編號.jpg\r\n') });
        const usedNames = new Set();
        let photoCount = 0;
        for (const entry of photoEntries()) {
          const blob = await getPhoto(entry.photoId);
          if (!blob) continue;
          const base = `${safeFilePart(entry.sampleName)}_${entry.countDate}_${entry.salinity}ppt_R${entry.rep}`;
          let name = `photos/${base}.jpg`;
          let suffix = 2;
          while (usedNames.has(name.toLowerCase())) name = `photos/${base}_${suffix++}.jpg`;
          usedNames.add(name.toLowerCase());
          files.push({ name, data: new Uint8Array(await blob.arrayBuffer()) });
          photoCount++;
        }
        const zip = createZip(files);
        downloadBlob(zip, `E4_readable_backup_${todayLocal()}.zip`);
        statusEl.textContent = `可閱讀備份已下載（${photoCount} 張照片）`;
      } catch (error) {
        console.error(error);
        statusEl.textContent = '可閱讀備份製作失敗';
        alert('無法製作 ZIP，請再試一次或先下載完整備份 JSON。');
      }
    });

    function allSessionCsvRows() {
      saveCurrentSession();
      const sessions = Object.values(state.sessions || {});
      const maxSections = Math.max(1, ...sessions.map(session => Number(session.sectionCount) || 0));
      const rows = [['sample_name', 'date', 'salinity_ppt', 'replicate', ...Array.from({ length: maxSections }, (_, i) => `section_${i + 1}`), 'total_colonies', 'has_photo', 'photo_filename', 'note']];
      sessions.sort((a, b) => `${a.countDate}${a.sampleName}`.localeCompare(`${b.countDate}${b.sampleName}`)).forEach(session => {
        (session.salinities || []).forEach(salinity => [1, 2, 3].forEach(rep => {
          const record = session.records?.[recordId(salinity, rep)] || { counts: [], note: '', hasPhoto: false };
          const counts = Array.from({ length: maxSections }, (_, i) => record.counts?.[i] ?? '');
          const photoName = record.hasPhoto ? `photos/${safeFilePart(session.sampleName || '未命名樣本')}_${session.countDate}_${salinity}ppt_R${rep}.jpg` : '';
          rows.push([session.sampleName || '', session.countDate || '', salinity, `R${rep}`, ...counts, totalFor(record), record.hasPhoto ? 'yes' : 'no', photoName, record.note || '']);
        }));
      });
      return rows;
    }

    function safeFilePart(value) {
      return String(value || 'unnamed').normalize('NFKC').replace(/[\\/:*?"<>|\u0000-\u001f]+/g, '_').replace(/\s+/g, '_').replace(/^_+|_+$/g, '').slice(0, 80) || 'unnamed';
    }

    function dataUrlToBlob(dataUrl) {
      if (typeof dataUrl !== 'string' || !dataUrl.startsWith('data:')) throw new Error('invalid photo');
      const [header, payload] = dataUrl.split(',', 2);
      const type = header.match(/^data:([^;,]+)/)?.[1] || 'image/jpeg';
      const binary = header.includes(';base64') ? atob(payload) : decodeURIComponent(payload);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return new Blob([bytes], { type });
    }

    const crcTable = (() => {
      const table = new Uint32Array(256);
      for (let n = 0; n < 256; n++) {
        let c = n;
        for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
        table[n] = c >>> 0;
      }
      return table;
    })();

    function crc32(bytes) {
      let crc = 0xffffffff;
      for (const byte of bytes) crc = crcTable[(crc ^ byte) & 0xff] ^ (crc >>> 8);
      return (crc ^ 0xffffffff) >>> 0;
    }

    function zipDateTime(date = new Date()) {
      const year = Math.max(1980, date.getFullYear());
      return {
        time: (date.getHours() << 11) | (date.getMinutes() << 5) | Math.floor(date.getSeconds() / 2),
        date: ((year - 1980) << 9) | ((date.getMonth() + 1) << 5) | date.getDate()
      };
    }

    function concatBytes(parts) {
      const output = new Uint8Array(parts.reduce((sum, part) => sum + part.length, 0));
      let offset = 0;
      parts.forEach(part => { output.set(part, offset); offset += part.length; });
      return output;
    }

    function createZip(files) {
      const encoder = new TextEncoder();
      const localParts = [];
      const centralParts = [];
      const { time, date } = zipDateTime();
      let offset = 0;
      files.forEach(file => {
        const name = encoder.encode(file.name.replaceAll('\\', '/'));
        const data = file.data instanceof Uint8Array ? file.data : new Uint8Array(file.data);
        const crc = crc32(data);
        const local = new Uint8Array(30 + name.length);
        const lv = new DataView(local.buffer);
        lv.setUint32(0, 0x04034b50, true); lv.setUint16(4, 20, true); lv.setUint16(6, 0x0800, true); lv.setUint16(8, 0, true);
        lv.setUint16(10, time, true); lv.setUint16(12, date, true); lv.setUint32(14, crc, true); lv.setUint32(18, data.length, true); lv.setUint32(22, data.length, true); lv.setUint16(26, name.length, true); lv.setUint16(28, 0, true);
        local.set(name, 30);
        localParts.push(local, data);
        const central = new Uint8Array(46 + name.length);
        const cv = new DataView(central.buffer);
        cv.setUint32(0, 0x02014b50, true); cv.setUint16(4, 20, true); cv.setUint16(6, 20, true); cv.setUint16(8, 0x0800, true); cv.setUint16(10, 0, true);
        cv.setUint16(12, time, true); cv.setUint16(14, date, true); cv.setUint32(16, crc, true); cv.setUint32(20, data.length, true); cv.setUint32(24, data.length, true); cv.setUint16(28, name.length, true);
        cv.setUint16(30, 0, true); cv.setUint16(32, 0, true); cv.setUint16(34, 0, true); cv.setUint16(36, 0, true); cv.setUint32(38, 0, true); cv.setUint32(42, offset, true);
        central.set(name, 46);
        centralParts.push(central);
        offset += local.length + data.length;
      });
      const central = concatBytes(centralParts);
      const end = new Uint8Array(22);
      const ev = new DataView(end.buffer);
      ev.setUint32(0, 0x06054b50, true); ev.setUint16(4, 0, true); ev.setUint16(6, 0, true); ev.setUint16(8, files.length, true); ev.setUint16(10, files.length, true); ev.setUint32(12, central.length, true); ev.setUint32(16, offset, true); ev.setUint16(20, 0, true);
      return new Blob([...localParts, central, end], { type: 'application/zip' });
    }

    function blobToDataUrl(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    document.querySelector('#clearAll').addEventListener('click', async () => {
      if (!confirm('確定清除所有 E4 計數與照片？此動作無法復原。')) return;
      localStorage.removeItem(STORAGE_KEY);
      indexedDB.deleteDatabase(DB_NAME);
      Object.assign(state, defaultState());
      ensureRecords();
      saveState();
      render();
    });

    photoSearchEl.addEventListener('input', renderPhotoLibrary);
    document.querySelector('#viewerClose').addEventListener('click', () => photoViewerEl.close());
    photoViewerEl.addEventListener('click', event => { if (event.target === photoViewerEl) photoViewerEl.close(); });

    applyTheme(localStorage.getItem(themeKey) || 'pumpkin');
    sampleNameEl.value = state.sampleName || '';
    countDateEl.value = state.countDate || todayLocal();
    ensureRecords();
    saveState();
    render();
  </script>
</body>
</html>
